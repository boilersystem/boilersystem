<body>
<div class="container">
    <div class="header">
        <h1>HP Türbin · Çoklu Konfigürasyon + Ara Isıtıcı</h1>
    </div>

    <div class="main-panel">
        <div class="menu-panel">
            <div class="menu-title">⚙️ Yapılandırma</div>
            <div class="menu-item">
                <label>Türbin sayısı</label>
                <input type="number" id="turbinSayisi" min="1" max="5" value="2">
            </div>
            <div class="menu-item">
                <label>Ara ısıtıcı sayısı (maks. türbin sayısı)</label>
                <input type="number" id="araIsiticiSayisi" min="0" max="5" value="1">
            </div>
            <div class="menu-item">
                <label>Sıralama (T: Türbin, A: Ara ısıtıcı)</label>
                <input type="text" id="siralama" value="T A T" placeholder="Örnek: T A T A T">
            </div>
            <button class="btn-generate" id="olusturBtn">Oluştur 🔄</button>
            <div class="info-note">
                📌 Sıralama, T ve A harfleriyle girilir. Toplam T sayısı türbin sayısına, A sayısı ara ısıtıcı sayısına eşit olmalıdır.
            </div>
        </div>

        <div class="content-panel" id="contentPanel"></div>
    </div>

    <div class="footer">
        ⚡ Buhar tablosu: 0.1–100 bar arası doymuş su/buhar özellikleri (interpolasyon) · Her türbin bağımsız hesaplar.
    </div>
</div>

<script>
(function() {
    // ---------- Birim Dönüşüm Fonksiyonları (Türbin) ----------
    function convertPressureToBar(value, unit) {
        switch(unit) {
            case 'bar': return value;
            case 'psi': return value * 0.0689476;
            case 'kpa': return value / 100;
            case 'mpa': return value * 10;
            default: return value;
        }
    }
    function convertTemperatureToC(value, unit) {
        switch(unit) {
            case 'c': return value;
            case 'f': return (value - 32) * 5/9;
            case 'k': return value - 273.15;
            default: return value;
        }
    }
    function convertFlowToKgs(value, unit) {
        switch(unit) {
            case 'kgh': return value / 3600;
            case 'kgs': return value;
            case 'lbh': return (value * 0.453592) / 3600;
            case 'lbs': return value * 0.453592;
            case 'tonh': return (value * 1000) / 3600;
            default: return value / 3600;
        }
    }
    function convertEfficiencyToFraction(value, unit) {
        switch(unit) {
            case 'percent': return value / 100;
            case 'fraction': return value;
            default: return value / 100;
        }
    }
    function convertFromBar(value, targetUnit) {
        switch(targetUnit) {
            case 'bar': return value;
            case 'psi': return value / 0.0689476;
            case 'kpa': return value * 100;
            case 'mpa': return value / 10;
            default: return value;
        }
    }
    function convertFromC(value, targetUnit) {
        switch(targetUnit) {
            case 'c': return value;
            case 'f': return value * 9/5 + 32;
            case 'k': return value + 273.15;
            default: return value;
        }
    }
    function convertPowerFromKw(value, targetUnit) {
        switch(targetUnit) {
            case 'kw': return value;
            case 'mw': return value / 1000;
            case 'btuh': return value * 3412.14;
            case 'kcalh': return value * 859.845;
            default: return value;
        }
    }

    const steamTableFull = [
        { P: 0.1, T: 45.83, hf: 191.83, hg: 2584.7, sf: 0.6493, sg: 8.1502 },
        { P: 0.2, T: 60.06, hf: 251.42, hg: 2609.7, sf: 0.8321, sg: 7.9085 },
        { P: 0.5, T: 81.35, hf: 340.56, hg: 2646.0, sf: 1.0912, sg: 7.5939 },
        { P: 1.0, T: 99.63, hf: 417.51, hg: 2675.5, sf: 1.3027, sg: 7.3594 },
        { P: 2.0, T: 120.23, hf: 504.70, hg: 2706.7, sf: 1.5301, sg: 7.1271 },
        { P: 5.0, T: 151.86, hf: 640.23, hg: 2748.7, sf: 1.8607, sg: 6.8192 },
        { P: 10.0, T: 179.91, hf: 762.81, hg: 2778.1, sf: 2.1387, sg: 6.5865 },
        { P: 20.0, T: 212.42, hf: 908.79, hg: 2799.5, sf: 2.4474, sg: 6.3409 },
        { P: 30.0, T: 233.90, hf: 1008.4, hg: 2804.2, sf: 2.6455, sg: 6.1869 },
        { P: 40.0, T: 250.40, hf: 1087.5, hg: 2801.4, sf: 2.7967, sg: 6.0701 },
        { P: 50.0, T: 263.99, hf: 1154.6, hg: 2794.3, sf: 2.9207, sg: 5.9734 },
        { P: 60.0, T: 275.64, hf: 1213.7, hg: 2784.3, sf: 3.0277, sg: 5.8892 },
        { P: 70.0, T: 285.88, hf: 1267.0, hg: 2772.1, sf: 3.1225, sg: 5.8142 },
        { P: 80.0, T: 295.06, hf: 1316.6, hg: 2758.0, sf: 3.2081, sg: 5.7450 },
        { P: 90.0, T: 303.40, hf: 1363.3, hg: 2742.1, sf: 3.2866, sg: 5.6799 },
        { P: 100.0, T: 311.06, hf: 1407.6, hg: 2725.5, sf: 3.3596, sg: 5.6151 }
    ];

    function interpolateProperties(P) {
        if (P < steamTableFull[0].P || P > steamTableFull[steamTableFull.length-1].P) return null;
        for (let i = 0; i < steamTableFull.length-1; i++) {
            if (steamTableFull[i].P <= P && steamTableFull[i+1].P >= P) {
                let pLow = steamTableFull[i].P, pHigh = steamTableFull[i+1].P;
                let ratio = (P - pLow) / (pHigh - pLow);
                return {
                    P: P,
                    T: steamTableFull[i].T + ratio * (steamTableFull[i+1].T - steamTableFull[i].T),
                    hf: steamTableFull[i].hf + ratio * (steamTableFull[i+1].hf - steamTableFull[i].hf),
                    hg: steamTableFull[i].hg + ratio * (steamTableFull[i+1].hg - steamTableFull[i].hg),
                    sf: steamTableFull[i].sf + ratio * (steamTableFull[i+1].sf - steamTableFull[i].sf),
                    sg: steamTableFull[i].sg + ratio * (steamTableFull[i+1].sg - steamTableFull[i].sg)
                };
            }
        }
        return null;
    }

    const CP_SUPERHEAT = 2.0;
    const CP_WATER = 4.2;

    function hesaplaTurbin(kart) {
        const pInRaw = parseFloat(kart.querySelector('.p_in').value);
        const pInUnit = kart.querySelector('.p_in_unit').value;
        const pIn = convertPressureToBar(pInRaw, pInUnit);

        const tInRaw = parseFloat(kart.querySelector('.t_in').value);
        const tInUnit = kart.querySelector('.t_in_unit').value;
        const tIn = convertTemperatureToC(tInRaw, tInUnit);

        const flowRaw = parseFloat(kart.querySelector('.flow').value);
        const flowUnit = kart.querySelector('.flow_unit').value;
        const mdot = convertFlowToKgs(flowRaw, flowUnit);

        const pOutRaw = parseFloat(kart.querySelector('.p_out').value);
        const pOutUnit = kart.querySelector('.p_out_unit').value;
        const pOut = convertPressureToBar(pOutRaw, pOutUnit);

        const effRaw = parseFloat(kart.querySelector('.eff').value);
        const effUnit = kart.querySelector('.eff_unit').value;
        const eff = convertEfficiencyToFraction(effRaw, effUnit);

        const genEffRaw = parseFloat(kart.querySelector('.gen_eff').value);
        const genEffUnit = kart.querySelector('.gen_eff_unit').value;
        const genEff = convertEfficiencyToFraction(genEffRaw, genEffUnit);

        if ([pIn, tIn, mdot, pOut, eff, genEff].some(isNaN)) {
            alert("Lütfen tüm alanları doldurun.");
            return;
        }
        if (pIn < 0.1 || pIn > 100 || pOut < 0.1 || pOut > 100) {
            alert("Basınçlar 0.1-100 bar arasında olmalıdır.");
            return;
        }
        if (eff <= 0 || eff > 1) {
            alert("Türbin verimi 0-1 arasında olmalıdır.");
            return;
        }
        if (genEff <= 0 || genEff > 1) {
            alert("Generatör verimi 0-1 arasında olmalıdır.");
            return;
        }
        if (mdot <= 0) {
            alert("Debi pozitif olmalıdır.");
            return;
        }
        if (pOut >= pIn) {
            alert("Çıkış basıncı giriş basıncından düşük olmalıdır.");
            return;
        }

        let inletSat = interpolateProperties(pIn);
        let outletSat = interpolateProperties(pOut);
        if (!inletSat || !outletSat) {
            alert("Basınç değerleri tablo dışında.");
            return;
        }

        let h_in, s_in;
        let T_sat_in = inletSat.T;
        if (tIn < T_sat_in - 0.5) {
            h_in = CP_WATER * tIn;
            let Tk_in = tIn + 273.15;
            s_in = CP_WATER * Math.log(Tk_in / 273.15);
        } else if (tIn >= T_sat_in - 0.5 && tIn <= T_sat_in + 0.5) {
            h_in = inletSat.hg;
            s_in = inletSat.sg;
        } else {
            h_in = inletSat.hg + CP_SUPERHEAT * (tIn - T_sat_in);
            let Tk_in = tIn + 273.15;
            let Tk_sat = T_sat_in + 273.15;
            s_in = inletSat.sg + CP_SUPERHEAT * Math.log(Tk_in / Tk_sat);
        }

        let sf_out = outletSat.sf, sg_out = outletSat.sg;
        let hf_out = outletSat.hf, hg_out = outletSat.hg;
        let T_sat_out = outletSat.T;

        let x_ideal, h_out_ideal;
        if (s_in >= sg_out) {
            let T_sat_abs = T_sat_out + 273.15;
            let T_out_ideal_abs = T_sat_abs * Math.exp((s_in - sg_out) / CP_SUPERHEAT);
            let T_out_ideal = T_out_ideal_abs - 273.15;
            h_out_ideal = hg_out + CP_SUPERHEAT * (T_out_ideal - T_sat_out);
            x_ideal = 1.0;
        } else {
            x_ideal = (s_in - sf_out) / (sg_out - sf_out);
            x_ideal = Math.min(1, Math.max(0, x_ideal));
            h_out_ideal = hf_out + x_ideal * (hg_out - hf_out);
        }

        let delta_h_ideal = h_in - h_out_ideal;
        let delta_h_real = delta_h_ideal * eff;
        let h_out_real = h_in - delta_h_real;

        let x_real, T_out_real;
        if (h_out_real >= hg_out) {
            x_real = 1.0;
            T_out_real = T_sat_out + (h_out_real - hg_out) / CP_SUPERHEAT;
        } else if (h_out_real <= hf_out) {
            x_real = 0.0;
            T_out_real = T_sat_out;
        } else {
            x_real = (h_out_real - hf_out) / (hg_out - hf_out);
            x_real = Math.min(1, Math.max(0, x_real));
            T_out_real = T_sat_out;
        }

        let power_kW = mdot * delta_h_real;
        let electric_kW = power_kW * genEff;

        kart.querySelector('.resPout').innerText = convertFromBar(pOut, pOutUnit).toFixed(2) + ' ' + pOutUnit;
        kart.querySelector('.resTsat').innerText = convertFromC(T_sat_out, tInUnit).toFixed(1) + ' ' + tInUnit;
        kart.querySelector('.resTout').innerText = convertFromC(T_out_real, tInUnit).toFixed(1) + ' ' + tInUnit;
        kart.querySelector('.resX').innerText = x_real.toFixed(4);
        kart.querySelector('.resHout').innerText = h_out_real.toFixed(2) + ' kJ/kg';
        kart.querySelector('.resHin').innerText = h_in.toFixed(2) + ' kJ/kg';
        kart.querySelector('.resPower').innerText = convertPowerFromKw(power_kW, 'kw').toFixed(2) + ' kW';
        kart.querySelector('.resElectric').innerText = convertPowerFromKw(electric_kW, 'kw').toFixed(2) + ' kW';
        kart.querySelector('.resFlow').innerText = flowRaw.toFixed(0) + ' ' + flowUnit;
        kart.querySelector('.resHf').innerText = hf_out.toFixed(2) + ' kJ/kg';
        kart.querySelector('.resHg').innerText = hg_out.toFixed(2) + ' kJ/kg';
        kart.querySelector('.resHfg').innerText = (hg_out - hf_out).toFixed(2) + ' kJ/kg';
    }

    function turbinKartOlustur(index) {
        const kart = document.createElement('div');
        kart.className = 'turbin-karti';
        kart.innerHTML = `
            <div class="turbin-baslik"><span>⚡ TÜRBİN ${index+1}</span></div>
            <div class="input-row">
                <div class="input-group"><label>Giriş basıncı</label><div class="input-wrapper"><input type="number" class="p_in" step="0.1" min="0.1" max="100" value="10"><select class="p_in_unit"><option value="bar" selected>bar</option><option value="psi">psi</option><option value="kpa">kPa</option><option value="mpa">MPa</option></select></div></div>
                <div class="input-group"><label>Giriş sıcaklığı</label><div class="input-wrapper"><input type="number" class="t_in" step="0.1" min="0.1" max="600" value="200"><select class="t_in_unit"><option value="c" selected>°C</option><option value="f">°F</option><option value="k">K</option></select></div></div>
            </div>
            <div class="input-row">
                <div class="input-group"><label>Debi</label><div class="input-wrapper"><input type="number" class="flow" step="1" min="1" value="3600"><select class="flow_unit"><option value="kgh" selected>kg/h</option><option value="kgs">kg/s</option><option value="lbh">lb/h</option><option value="lbs">lb/s</option><option value="tonh">ton/h</option></select></div></div>
                <div class="input-group"><label>Çıkış basıncı</label><div class="input-wrapper"><input type="number" class="p_out" step="0.1" min="0.1" max="100" value="1"><select class="p_out_unit"><option value="bar" selected>bar</option><option value="psi">psi</option><option value="kpa">kPa</option><option value="mpa">MPa</option></select></div></div>
            </div>
            <div class="input-row">

        kart.querySelector('.btn-calculate').addEventListener('click', function(e) {

    }

    // ---------- Birim Dönüşüm Fonksiyonları (Ara Isıtıcı) ----------
    function toCelsius(value, unit) {
        if (unit === 'C') return value;
        if (unit === 'F') return (value - 32) / 1.8;
        if (unit === 'K') return value - 273.15;
        return value;
    }
    function fromCelsius(value, unit) {
        if (unit === 'C') return value;
        if (unit === 'F') return value * 1.8 + 32;
        if (unit === 'K') return value + 273.15;
        return value;
    }
    function toKgPerS(value, unit) {
        if (unit === 'kg/s') return value;
        if (unit === 'kg/h') return value / 3600;
        if (unit === 'lb/s') return value * 0.453592;
        if (unit === 'lb/h') return value * 0.453592 / 3600;
        return value;
    }
    function toKw(value, unit) {
        if (unit === 'kW') return value;
        if (unit === 'BTU/h') return value / 3412.14;
        if (unit === 'kcal/h') return value / 859.845;
        return value;
    }
    function fromKw(value, unit) {
        if (unit === 'kW') return value;
        if (unit === 'BTU/h') return value * 3412.14;
        if (unit === 'kcal/h') return value * 859.845;
        return value;
    }
    function toKjPerKgC(value, unit) {
        if (unit === 'kJ/kgC') return value;
        if (unit === 'BTU/lbF') return value * 4.1868;
        if (unit === 'kcal/kgC') return value * 4.1868;
        return value;
    }

    function calculateMod1(container) {
        try {
            const T_in_val = parseFloat(container.querySelector('.T_in1').value);
            const T_in_unit = container.querySelector('.T_inUnit1').value;
            const m_val = parseFloat(container.querySelector('.m_dot1').value);
            const m_unit = container.querySelector('.m_dotUnit1').value;
            const Q_val = parseFloat(container.querySelector('.Q1').value);
            const Q_unit = container.querySelector('.QUnit1').value;
            const cp_val = parseFloat(container.querySelector('.cp1').value);
            const cp_unit = container.querySelector('.cpUnit1').value;

            if (isNaN(T_in_val) || isNaN(m_val) || isNaN(Q_val) || isNaN(cp_val) || m_val <= 0 || cp_val <= 0) {
                alert('Lütfen geçerli pozitif sayılar girin (debi ve Cp sıfırdan büyük olmalı).');
                return;
            }

            const T_in_C = toCelsius(T_in_val, T_in_unit);
            const m_kg_s = toKgPerS(m_val, m_unit);
            const Q_kW = toKw(Q_val, Q_unit);
            const cp_kJ_kgC = toKjPerKgC(cp_val, cp_unit);

            const deltaT = Q_kW / (m_kg_s * cp_kJ_kgC);
            const T_out_C = T_in_C + deltaT;

            const T_out_unit = container.querySelector('.T_outUnit1').value;
            const T_out_disp = fromCelsius(T_out_C, T_out_unit);

            container.querySelector('.T_out1').innerText = T_out_disp.toFixed(3);
        } catch (e) {
            alert('Hesaplama hatası: ' + e.message);
        }
    }

    function calculateMod2(container) {
        try {
            const T_in_val = parseFloat(container.querySelector('.T_in2').value);
            const T_in_unit = container.querySelector('.T_inUnit2').value;
            const T_out_val = parseFloat(container.querySelector('.T_out2').value);
            const T_out_unit = container.querySelector('.T_outUnit2').value;
            const m_val = parseFloat(container.querySelector('.m_dot2').value);
            const m_unit = container.querySelector('.m_dotUnit2').value;
            const cp_val = parseFloat(container.querySelector('.cp2').value);
            const cp_unit = container.querySelector('.cpUnit2').value;

            if (isNaN(T_in_val) || isNaN(T_out_val) || isNaN(m_val) || isNaN(cp_val) || m_val <= 0 || cp_val <= 0) {
                alert('Lütfen geçerli pozitif sayılar girin (debi ve Cp sıfırdan büyük olmalı).');
                return;
            }

            const T_in_C = toCelsius(T_in_val, T_in_unit);
            const T_out_C = toCelsius(T_out_val, T_out_unit);
            const m_kg_s = toKgPerS(m_val, m_unit);
            const cp_kJ_kgC = toKjPerKgC(cp_val, cp_unit);

            const deltaT = T_out_C - T_in_C;
            if (deltaT < 0) {
                alert('Uyarı: Çıkış sıcaklığı girişten düşük, ısıtma değil soğutma hesaplanıyor (Q negatif çıkabilir).');
            }

            const Q_kW = m_kg_s * cp_kJ_kgC * deltaT;
            const Q_out_unit = container.querySelector('.Q_outUnit2').value;
            const Q_disp = fromKw(Q_kW, Q_out_unit);

            container.querySelector('.Q2').innerText = Q_disp.toFixed(3);
        } catch (e) {
            alert('Hesaplama hatası: ' + e.message);
        }
    }

    function araIsiticiKartOlustur(index) {
        const kart = document.createElement('div');
        kart.className = 'ara-isitici-karti';
        kart.setAttribute('data-index', index);
        kart.innerHTML = `
            <div class="ara-isitici-baslik">🔥 ARA ISITICI ${index+1}</div>
            <div class="mod-secimi">
                <button class="mod-btn mod1-btn aktif" type="button">Mod 1 (Çıkış Sıcaklığı)</button>
                <button class="mod-btn mod2-btn" type="button">Mod 2 (Isı Yükü Q)</button>
            </div>
            <div class="mod1-content">
                <div class="ara-input-row"><div class="ara-input-group"><label>Özgül ısı (Cp):</label><div class="ara-input-wrapper"><input type="number" class="cp1" step="any" value="4.18"><select class="cpUnit1"><option value="kJ/kgC">kJ/kg°C</option><option value="BTU/lbF">BTU/lb°F</option><option value="kcal/kgC">kcal/kg°C</option></select></div></div></div>
                <div class="ara-input-row">
                    <div class="ara-input-group"><label>Giriş sıcaklığı:</label><div class="ara-input-wrapper"><input type="number" class="T_in1" step="any" value="20"><select class="T_inUnit1"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select></div></div>
                    <div class="ara-input-group"><label>Giriş basıncı (bilgi):</label><div class="ara-input-wrapper"><input type="number" class="P_in1" step="any" value="1"><select class="P_inUnit1"><option value="bar">bar</option><option value="psi">psi</option><option value="kPa">kPa</option></select></div></div>
                </div>
                <div class="ara-input-row">
                    <div class="ara-input-group"><label>Debi:</label><div class="ara-input-wrapper"><input type="number" class="m_dot1" step="any" value="1"><select class="m_dotUnit1"><option value="kg/s">kg/s</option><option value="kg/h">kg/h</option><option value="lb/s">lb/s</option><option value="lb/h">lb/h</option></select></div></div>
                    <div class="ara-input-group"><label>Isı yükü (Q):</label><div class="ara-input-wrapper"><input type="number" class="Q1" step="any" value="100"><select class="QUnit1"><option value="kW">kW</option><option value="BTU/h">BTU/h</option><option value="kcal/h">kcal/h</option></select></div></div>
                </div>
                <button class="btn-calculate">Hesapla (Mod 1)</button>
                <div class="ara-sonuc"><span>Çıkış sıcaklığı:</span><output class="T_out1">-</output><select class="T_outUnit1"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select></div>
            </div>
            <div class="mod2-content" style="display: none;">
                <div class="ara-input-row"><div class="ara-input-group"><label>Özgül ısı (Cp):</label><div class="ara-input-wrapper"><input type="number" class="cp2" step="any" value="4.18"><select class="cpUnit2"><option value="kJ/kgC">kJ/kg°C</option><option value="BTU/lbF">BTU/lb°F</option><option value="kcal/kgC">kcal/kg°C</option></select></div></div></div>
                <div class="ara-input-row">
                    <div class="ara-input-group"><label>Giriş sıcaklığı:</label><div class="ara-input-wrapper"><input type="number" class="T_in2" step="any" value="20"><select class="T_inUnit2"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select></div></div>
                    <div class="ara-input-group"><label>Çıkış sıcaklığı:</label><div class="ara-input-wrapper"><input type="number" class="T_out2" step="any" value="80"><select class="T_outUnit2"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select></div></div>
                </div>
                <div class="ara-input-row">
                    <div class="ara-input-group"><label>Giriş basıncı (bilgi):</label><div class="ara-input-wrapper"><input type="number" class="P_in2" step="any" value="1"><select class="P_inUnit2"><option value="bar">bar</option><option value="psi">psi</option><option value="kPa">kPa</option></select></div></div>
                    <div class="ara-input-group"><label>Debi:</label><div class="ara-input-wrapper"><input type="number" class="m_dot2" step="any" value="1"><select class="m_dotUnit2"><option value="kg/s">kg/s</option><option value="kg/h">kg/h</option><option value="lb/s">lb/s</option><option value="lb/h">lb/h</option></select></div></div>
                </div>
                <button class="btn-calculate">Hesapla (Mod 2)</button>
                <div class="ara-sonuc"><span>Gerekli ısı (Q):</span><output class="Q2">-</output><select class="Q_outUnit2"><option value="kW">kW</option><option value="BTU/h">BTU/h</option><option value="kcal/h">kcal/h</option></select></div>
            </div>
        `;
        const mod1Btn = kart.querySelector('.mod1-btn');
        const mod2Btn = kart.querySelector('.mod2-btn');
        const mod1Content = kart.querySelector('.mod1-content');
        const mod2Content = kart.querySelector('.mod2-content');
        mod1Btn.addEventListener('click', function() {
            mod1Btn.classList.add('aktif');
            mod2Btn.classList.remove('aktif');
            mod1Content.style.display = 'block';
            mod2Content.style.display = 'none';
        });
        mod2Btn.addEventListener('click', function() {
            mod2Btn.classList.add('aktif');
            mod1Btn.classList.remove('aktif');
            mod2Content.style.display = 'block';
            mod1Content.style.display = 'none';
        });
        kart.querySelector('.mod1-content .btn-calculate').addEventListener('click', function(e) {
            e.preventDefault();
            calculateMod1(kart);
        });
        kart.querySelector('.mod2-content .btn-calculate').addEventListener('click', function(e) {

        });

    }

    // Maksimum ara ısıtıcı sayısını türbin sayısına eşitle
    function updateMaxAraIsitici() {
        const turbinSayisi = parseInt(document.getElementById('turbinSayisi').value) || 1;
        const araInput = document.getElementById('araIsiticiSayisi');
        araInput.max = turbinSayisi; // türbin sayısı kadar olabilir
        if (parseInt(araInput.value) > turbinSayisi) {
            araInput.value = turbinSayisi;
        }
    }

    document.getElementById('turbinSayisi').addEventListener('input', updateMaxAraIsitici);
    document.getElementById('araIsiticiSayisi').addEventListener('input', function() {
        const turbinSayisi = parseInt(document.getElementById('turbinSayisi').value) || 1;
        const araInput = document.getElementById('araIsiticiSayisi');
        if (parseInt(araInput.value) > turbinSayisi) {
            araInput.value = turbinSayisi;
        }
    });

    document.getElementById('olusturBtn').addEventListener('click', function() {
        const turbinSayisi = parseInt(document.getElementById('turbinSayisi').value) || 1;
        const araIsiticiSayisi = parseInt(document.getElementById('araIsiticiSayisi').value) || 0;

        const siralamaStr = document.getElementById('siralama').value.trim().replace(/\s+/g, '').toUpperCase();
        const sirala = [];
        for (let ch of siralamaStr) {
            if (ch === 'T' || ch === 'A') sirala.push(ch);
        }
        const tCount = sirala.filter(ch => ch === 'T').length;
        const aCount = sirala.filter(ch => ch === 'A').length;

        if (tCount !== turbinSayisi) {
            alert(`Sıralamada ${turbinSayisi} adet T olmalı, ancak ${tCount} adet var.`);
            return;
        }
        if (aCount !== araIsiticiSayisi) {
            alert(`Sıralamada ${araIsiticiSayisi} adet A olmalı, ancak ${aCount} adet var.`);
            return;
        }

        const panel = document.getElementById('contentPanel');
        panel.innerHTML = '';
        let turbinIndex = 0, ariIndex = 0;
        sirala.forEach(ch => {
            if (ch === 'T') {
                panel.appendChild(turbinKartOlustur(turbinIndex));
                turbinIndex++;
            } else {
                panel.appendChild(araIsiticiKartOlustur(ariIndex));
                ariIndex++;
            }
        });
    });

    window.addEventListener('load', function() {
        updateMaxAraIsitici();
        // Varsayılan sıralamayı ayarla (kullanıcı değiştirebilir)
        document.getElementById('siralama').value = 'T A T';
        // Otomatik oluştur
        document.getElementById('olusturBtn').click();
    });
})();
</script>
